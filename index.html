<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate living pixel-art worlds from a seed — castles, villages, ruins, seas and storms — and export seamless looping GIFs.">
  <meta name="theme-color" content="#10151c">
  <title>Pixel World Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Press+Start+2P&display=swap">
</head>
<body>
  <main class="app">
    <section class="viewer" aria-label="Preview">
      <div class="stage" id="stage">
        <canvas id="preview" role="img" aria-label="Animated preview of the generated world"></canvas>
      </div>
      <div class="viewer-bar">
        <p class="caption" id="summary">—</p>
        <div class="viewer-actions">
          <button id="play" type="button" aria-pressed="true" data-i18n="pause">Pause</button>
          <button id="copy" type="button" data-i18n="copyLink">Copy link</button>
          <button id="lang" type="button" aria-label="Language">RU</button>
        </div>
      </div>
      <section class="gallery" aria-labelledby="gallery-title">
        <div class="gallery-head">
          <h2 id="gallery-title" data-i18n="gallery">Gallery</h2>
          <button id="save" type="button" data-i18n="save">★ Save to gallery</button>
        </div>
        <ul id="favourites" class="favourites"></ul>
        <p class="hint" id="gallery-empty" data-i18n="emptyGallery">Saved worlds appear here.</p>
        <h3 data-i18n="recent">Recent seeds</h3>
        <ul id="recent" class="recent"></ul>
      </section>
    </section>

    <form class="panel" id="controls" onsubmit="return false">
      <div class="panel-head">
        <h1 data-i18n="title">Pixel World Generator</h1>
        <button id="surprise" type="button" class="primary" data-i18n="randomAll">Surprise me</button>
      </div>

      <details open>
        <summary data-i18n="world">World</summary>
        <label class="field">
          <span data-i18n="seed">Seed</span>
          <span class="row">
            <input id="seed" type="number" min="0" max="999999999" step="1" inputmode="numeric">
            <button id="random" type="button" data-i18n="random">Random</button>
          </span>
        </label>
        <label class="field"><span data-i18n="biome">Biome</span><select id="biome"></select></label>
        <label class="field"><span data-i18n="format">Format</span><select id="format"></select></label>
        <label class="field"><span data-i18n="size">World size</span><select id="size"></select></label>
        <label class="check"><input id="pan" type="checkbox"><span data-i18n="pan">Panorama</span></label>
      </details>

      <details open>
        <summary data-i18n="timeWeather">Time &amp; weather</summary>
        <label class="field">
          <span><b data-i18n="time">Time of day</b> <output id="time-out" for="time"></output></span>
          <input id="time" type="range" min="0" max="24" step="0.25">
        </label>
        <label class="check"><input id="timelapse" type="checkbox"><span data-i18n="timelapse">Time-lapse</span></label>
        <fieldset class="field">
          <legend data-i18n="weather">Weather</legend>
          <div class="segmented" id="weather"></div>
        </fieldset>
        <label class="field">
          <span><b data-i18n="intensity">Intensity</b> <output id="intensity-out" for="intensity"></output></span>
          <input id="intensity" type="range" min="0" max="1" step="0.05">
        </label>
        <label class="field"><span data-i18n="season">Season</span><select id="season"></select></label>
      </details>

      <details>
        <summary data-i18n="look">Look</summary>
        <label class="field"><span data-i18n="palette">Palette</span><select id="palette"></select></label>
        <div class="swatches" id="swatches" aria-hidden="true"></div>
        <label class="field" id="custom-field" hidden>
          <span data-i18n="customColors">Custom colours</span>
          <textarea id="custom" rows="2" spellcheck="false" aria-describedby="custom-hint"></textarea>
          <small id="custom-hint" data-i18n="customHint">Hex colours</small>
        </label>
        <fieldset class="field">
          <legend data-i18n="layers">Layers</legend>
          <div class="checks" id="layers"></div>
        </fieldset>
        <label class="field">
          <span data-i18n="caption">Caption</span>
          <input id="caption" type="text" maxlength="40" aria-describedby="caption-hint">
          <small id="caption-hint" data-i18n="captionHint">Optional text</small>
        </label>
      </details>

      <details>
        <summary data-i18n="animation">Animation</summary>
        <label class="field">
          <span><b data-i18n="frames">Frames</b> <output id="frames-out" for="frames"></output></span>
          <input id="frames" type="range" min="12" max="240" step="12">
        </label>
        <label class="field">
          <span><b data-i18n="fps">Frames per second</b> <output id="fps-out" for="fps"></output></span>
          <input id="fps" type="range" min="4" max="30" step="1">
        </label>
      </details>

      <details open>
        <summary data-i18n="export">Export</summary>
        <label class="field"><span data-i18n="scale">Pixel scale</span><select id="scale"></select></label>
        <p class="estimate"><span data-i18n="estimate">Estimated GIF size</span>: <b id="estimate">…</b></p>
        <div class="exports">
          <button id="export-gif" type="button" class="primary" data-i18n="gif">GIF</button>
          <button id="export-png" type="button" data-i18n="png">PNG frame</button>
          <button id="export-sheet" type="button" data-i18n="sheet">Sprite sheet</button>
          <button id="export-webm" type="button" data-i18n="webm">WebM video</button>
        </div>
        <div class="progress" hidden id="progress"><i></i></div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </details>
    </form>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
