name: World of the day

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render today's world
        run: |
          mkdir -p out
          npm run --silent cli -- --daily --scale 3 --out out/world.gif | tee out/info.txt
      - name: Publish to the daily branch
        # The branch holds only today's picture: force-pushed so history never grows.
        run: |
          cd out
          git init -q -b daily
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world.gif info.txt
          git commit -q -m "World of the day $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" daily
